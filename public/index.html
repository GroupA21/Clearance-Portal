<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graduation Clearance Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b3a5f;--teal:#1b3a5f;--teal2:#3b6aa5;--gold:#c9a227;--green:#226144;--bg:#f3f5f9;--line:#dfe4ec;--muted:#566275;--red:#b3261e;--amber:#b7791f;--ink:#1a2233}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,textarea{font-family:inherit}
button{font-family:inherit;cursor:pointer;transition:.15s}
.hdr{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 28px;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.brand b{display:block;font-size:15px;color:var(--navy)}.brand span{font-size:12px;color:var(--muted)}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#e6edf6;color:var(--teal);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.btn{border-radius:10px;padding:10px 18px;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:#142c47;color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.green:hover{filter:brightness(.92);color:#fff}
.btn.red{border-color:#f0c7c3;color:var(--red)}.btn.red:hover{background:#fdecea;color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.hdr .btn{padding:8px 16px}
.proto{background:#fff7e0;color:#7a5b00;text-align:center;font-size:12px;padding:6px;border-bottom:1px solid #f3e3a9}
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:#fff}
.hero{background:radial-gradient(circle at 20% 15%,#2f5b94,transparent 45%),linear-gradient(160deg,#1b3a5f,#10243d);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.hero .logo{background:var(--gold);color:var(--navy);width:52px;height:52px;font-size:17px}
.hero h2{font-size:34px;line-height:1.15;margin:0 0 14px;letter-spacing:-.5px}
.hero p{opacity:.85;max-width:380px;margin:0 0 26px}
.hero ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.hero li{display:flex;gap:12px;align-items:center;font-size:14px}
.hero li i{font-style:normal;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:12px;font-weight:700}
.hero small{opacity:.7}
.login{width:100%;max-width:400px;margin:auto;padding:40px 28px;align-self:center}
.login .logo{width:64px;height:64px;margin:0 auto 18px;font-size:20px;border-radius:18px}
.login h1{text-align:center;margin:0;color:var(--navy);font-size:26px;letter-spacing:-.4px}
.login p.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 26px}
label.l{display:block;font-weight:600;color:var(--ink);margin:0 0 6px;font-size:13px}
input[type=text],input[type=password],input[type=email],input[type=tel],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;transition:.15s}
input[readonly]{background:#f3f5f9;color:#445066}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(27,58,95,.18)}
input[type=checkbox]{accent-color:var(--teal);width:16px;height:16px}
.fld{margin-bottom:16px}.hint{font-size:12px;color:var(--muted);margin-top:6px}
.err{background:#fdecea;color:var(--red);border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
.pfoot{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:3px 12px;z-index:4;white-space:nowrap}
.demo{margin-top:16px;font-size:12px;color:var(--muted);background:#f3f5f9;border-radius:10px;padding:10px 12px}
.demo a{color:var(--teal);font-weight:700;cursor:pointer;text-decoration:underline}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(20,40,80,.08);max-width:860px;margin:28px auto;padding:36px;border:1px solid var(--line)}
.wrap{padding:0 14px}
.card h2{margin:0 0 6px;color:var(--navy);font-size:26px;letter-spacing:-.4px}
.lead{color:var(--muted);margin:0 0 20px}
.card>h2,.card>.lead{text-align:center}.card>.lead{max-width:560px;margin-left:auto;margin-right:auto}
.info{background:#e6edf6;border:1px solid #bdd0e8;color:#1e3f66;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:22px}
.warn{background:#fdecea;border:1px solid #f4c2be;color:#7a1b15;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:22px}
.sec h3{color:var(--navy);font-size:15px;margin:30px 0 14px;display:flex;align-items:center;gap:8px}
.sec h3:after{content:"";flex:1;height:1px;background:var(--line)}
.box{border:1px solid var(--line);background:#fafbfd;border-radius:14px;padding:18px;margin-bottom:6px}
.box h4{margin:0 0 2px;color:var(--navy);font-size:14px}.box .d{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.login-wrap{grid-template-columns:1fr}.hero{display:none}}
@media(max-width:640px){.grid{grid-template-columns:1fr}.card{padding:20px}.hdr{padding:10px 14px}.brand span{display:none}}
.ck{display:flex;gap:10px;align-items:flex-start;margin:9px 0;font-size:13px}
.ck input{margin-top:2px}
.file{border:1.5px dashed #b9c3d3;border-radius:10px;background:#fff;padding:10px}
.file input{width:100%;font-size:12.5px}
.file .cur{font-size:12px;color:var(--green);margin-top:4px}
.req{color:var(--red)}
.fl{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;display:block}
.center{text-align:center}
.ico{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:6px auto 16px;font-size:34px}
.ico.wait{background:#fdf0c9}.ico.ok{background:#dcf3e4;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 14px}
.stat{border:1px solid var(--line);border-radius:14px;background:#fafbfd;text-align:center;padding:16px}
.stat b{display:block;font-size:24px;color:var(--teal)}.stat span{font-size:12px;color:var(--muted)}
.bar{height:10px;background:#e3e8f0;border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:.4s}
.unit{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;margin-bottom:10px}
.unit b{color:var(--navy);font-size:13.5px}.unit p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 12px;white-space:nowrap}
.b-p{background:#fdf0c9;color:var(--amber)}.b-a{background:#dcf3e4;color:var(--green)}.b-r{background:#fbdcd9;color:var(--red)}
.reason{font-size:12px;color:var(--red)}
.slip{border:2px solid var(--teal);border-radius:18px;padding:30px;margin:26px 0 16px;position:relative;overflow:hidden;background:linear-gradient(180deg,#f7f9fd,#fff)}
.slip h3{text-align:center;margin:0;color:var(--navy);font-size:20px;letter-spacing:1px}
.slip .s{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 24px}
.slip .g{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.slip .g small{display:block;color:var(--muted);font-size:12px}.slip .g b{font-size:15px}
.stat-ok{background:var(--green);color:#fff;text-align:center;font-weight:800;letter-spacing:2px;border-radius:12px;padding:14px;margin-top:24px}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:46px;font-weight:800;color:rgba(27,58,95,.06);transform:rotate(-24deg);text-align:center;line-height:1.1}
.slip .note{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--navy);background:#f3f5f9}
.u-act{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(10,24,45,.55);z-index:20;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.doc span{font-size:12px;color:var(--muted)}.doc img{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line)}
@media print{
  body{background:#fff}.hdr,.proto,.no-print,.row,.lead,.card>h2,.ico,.card>.center{display:none!important}
  .card{box-shadow:none;border:0;margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="pfoot no-print">CSC 302 course project · Group A21</div>
<script>
const UNITS=[
 {k:"dept",n:"Department Clearance",d:"Cross-check of academic records, project status, and departmental student file."},
 {k:"faculty",n:"Faculty Clearance",d:"Faculty-level graduation requirements and outstanding faculty obligations."},
 {k:"library",n:"Main Library Clearance",d:"Returned books, library materials, and outstanding fines."},
 {k:"bursary",n:"Bursary / Financial Clearance",d:"School fees, graduation levy, alumni levy, and other payment evidence."},
 {k:"affairs",n:"Student Affairs Clearance",d:"Hostel obligations (if any) and disciplinary standing."},
 {k:"admission",n:"Admission Office Clearance",d:"Verification of admission records for certificate processing."},
 {k:"sports",n:"Sports Council Clearance",d:"Sports equipment and Sports Council related obligations."}
];
// Demo student records (prototype – password is the surname)
const STUDENTS={};
const SKEY="ugc_session";let S={token:null,role:null,id:null},memS=null;
try{S=JSON.parse(sessionStorage.getItem(SKEY))||S}catch{S=memS||S}
function saveSess(){memS=S;try{S.token?sessionStorage.setItem(SKEY,JSON.stringify(S)):sessionStorage.removeItem(SKEY)}catch{}}
let ME={student:null,app:null,id:null},ADM={students:{},apps:{},settings:{strict:false}},setup=null;
const getStudent=id=>ADM.students[id]||(ME.id===id?ME.student:null);
const load=()=>ADM.apps;
const settings=()=>ADM.settings||{};
const profiles=()=>ADM.students;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,body){
  const o={method:body?"POST":"GET",headers:{}};
  if(S.token)o.headers.Authorization="Bearer "+S.token;
  if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  let r;try{r=await fetch(path,o)}catch{throw new Error("Cannot reach the server. Check your internet connection.")}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&S.token&&!/login$/.test(path)){S={token:null,role:null,id:null};saveSess();loginError="Session expired. Please log in again.";render();throw new Error("Session expired.")}
  if(!r.ok)throw new Error(j.error||"Something went wrong.");
  return j;
}
function startSess(token,role,id){S={token,role,id};saveSess();adminLogin=false;setup=null;loginError="";render()}
let loginError="",formError="";

function overall(app){
  if(!app)return"none";
  const v=UNITS.map(u=>app.units[u.k].status);
  if(v.every(s=>s==="approved"))return"cleared";
  if(v.includes("rejected"))return"rejected";
  return"pending";
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function header(label){
  return `<div class="hdr"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></svg></div><div><b>Automated Online Graduation Clearance</b><span>University of Ibadan</span></div></div>
  <div class="hr"><span class="pill">${label}</span><button class="btn" onclick="logout()">Logout</button></div></div>`;
}

async function render(){
  const app=$("#app");
  if(!S.token){app.innerHTML=adminLogin?adminLoginView():setup?setupView():loginView();return}
  try{
    if(S.role==="admin"){ADM=await api("/api/admin/data");app.innerHTML=adminView();return}
    const m=await api("/api/me");ME={student:m.student,app:m.app,id:S.id};
    const s=m.student,rec=m.app,id=S.id,st=overall(rec);
    const label=`${esc(s.name)} (${id})`;
    let body;
    if(st==="none")body=formView(id,s,null);
    else if(st==="rejected")body=formView(id,s,rec);
    else if(st==="pending")body=pendingView(rec);
    else body=clearedView(id,s,rec);
    app.innerHTML=header(label)+body;
    window.scrollTo(0,0);
  }catch(e){
    if(!S.token)return;
    app.innerHTML=header("")+`<div class="wrap"><div class="card"><div class="err">${esc(e.message)}</div><button class="btn" onclick="render()">Retry</button></div></div>`;
  }
}

/* ---------- Login ---------- */
function loginView(){
  return `<div class="login-wrap"><div class="hero"><div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></svg></div><div><h2>Graduation clearance,<br>all in one place.</h2><p>Submit once and track every unit's approval online – no more running from office to office.</p>
  <ul><li><i>1</i>Fill in one application form</li><li><i>2</i>Track 7 unit approvals live</li><li><i>3</i>Print your clearance slip</li></ul></div><small>Automated Online Clearance System</small></div><form class="login" onsubmit="doLogin(event)">
  <div class="logo">UI</div><h1>Graduation Clearance Portal</h1>
  <p class="sub">University of Ibadan · Automated Online Clearance System</p>
  ${loginError?`<div class="err">${esc(loginError)}</div>`:""}
  <div class="fld"><label class="l" for="m">Matriculation Number</label><input type="text" id="m" autocomplete="username" required></div>
  <div class="fld"><label class="l" for="p">Password</label><input type="password" id="p" autocomplete="current-password" required>
  <div class="hint">Use your <b>Surname</b> as your password.</div></div>
  <button class="btn primary" style="width:100%;padding:12px">Login</button>
  <div class="foot">For final-year / graduating students only</div></form></div>`;
}
function fill(a,b){$("#m").value=a;$("#p").value=b}
async function doLogin(e){
  e.preventDefault();
  const m=$("#m").value.trim().toUpperCase(),p=$("#p").value.trim().toLowerCase();
  try{
    const r=await api("/api/login",{matric:m,password:p});
    if(r.needsSetup){setup={m,p};loginError="";return render()}
    startSess(r.token,"student",m);
  }catch(err){loginError=err.message;render()}
}
function setupView(){
  return `<div class="login-wrap"><div class="hero"><div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></svg></div><div><h2>Graduation clearance,<br>all in one place.</h2><p>Submit once and track every unit's approval online – no more running from office to office.</p>
  <ul><li><i>1</i>Fill in one application form</li><li><i>2</i>Track 7 unit approvals live</li><li><i>3</i>Print your clearance slip</li></ul></div><small>Automated Online Clearance System</small></div><form class="login" onsubmit="doSetup(event)">
  <div class="logo">UI</div><h1>First-time Setup</h1>
  <p class="sub">Matric ${esc(setup.m)} – confirm your details to continue</p>
  ${loginError?`<div class="err">${esc(loginError)}</div>`:""}
  <div class="fld"><label class="l">Full Name (Surname first)</label><input type="text" id="sn" placeholder="OLANIYAN TAOFEEQ" required></div>
  <div class="fld"><label class="l">Faculty</label><input type="text" id="sf" placeholder="Science" required></div>
  <div class="fld"><label class="l">Department</label><input type="text" id="sd" placeholder="Computer Science" required></div>
  <div class="fld"><label class="l">Level / Programme</label><input type="text" id="sl" value="Final Year (400 Level)" required>
  <div class="hint">Your password was your surname – it must match the first name above.</div></div>
  <div class="row"><button class="btn primary" style="flex:1;padding:12px">Continue</button><button type="button" class="btn" onclick="setup=null;loginError='';render()">Back</button></div></form></div>`;
}
async function doSetup(e){
  e.preventDefault();
  const name=$("#sn").value.trim().replace(/\s+/g," ").toUpperCase();
  try{
    const r=await api("/api/setup",{matric:setup.m,password:setup.p,name,faculty:$("#sf").value.trim(),dept:$("#sd").value.trim(),level:$("#sl").value.trim()});
    startSess(r.token,"student",setup.m);
  }catch(err){loginError=err.message;render()}
}

let adminLogin=/admin/i.test(location.hash);
function adminLoginView(){
  return `<div class="login-wrap"><form class="login" onsubmit="doAdminLogin(event)" style="grid-column:1/-1">
  <div class="logo">UI</div><h1>Admin Login</h1>
  <p class="sub">Authorised unit officers only</p>
  ${loginError?`<div class="err">${esc(loginError)}</div>`:""}
  <div class="fld"><label class="l" for="am">Admin ID</label><input type="text" id="am" autocomplete="username" required></div>
  <div class="fld"><label class="l" for="ap">Password</label><input type="password" id="ap" autocomplete="current-password" required></div>
  <button class="btn primary" style="width:100%;padding:12px">Login</button>
  <div class="foot"><a href="#" style="color:var(--teal);font-weight:600" onclick="event.preventDefault();showStudent()">← Back to student login</a></div></form></div>`;
}
function showAdmin(){adminLogin=true;loginError="";render()}
function showStudent(){adminLogin=false;loginError="";try{history.replaceState(null,"",location.pathname+location.search)}catch{}render()}
async function doAdminLogin(e){
  e.preventDefault();
  try{
    const r=await api("/api/admin/login",{id:$("#am").value.trim(),password:$("#ap").value});
    startSess(r.token,"admin","ADMIN");
  }catch(err){loginError=err.message;render()}
}
function logout(){adminLogin=false;setup=null;S={token:null,role:null,id:null};saveSess();loginError="";render()}

/* ---------- Form ---------- */
function fileField(name,label,req,old){
  return `<div><span class="fl">${label}${req?' <span class="req">*</span>':""}</span><div class="file"><input type="file" name="${name}" ${req&&!old?"required":""}>${old?`<div class="cur">Previously uploaded: ${esc(old)}</div>`:""}</div></div
